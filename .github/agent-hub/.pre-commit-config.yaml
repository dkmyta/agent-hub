# The agent hub's local checks, defined once and reused by CI
# (agent-hub-tests.yml; see CONTRIBUTING.md):
# - on commit: fast formatting and lint (also CI's Lint job)
# - on push: the test suite (also CI's Test job)
# Local hooks give early feedback but can be skipped; CI is the gate.
#
# Scoped to the hub's files, so in a repository with the hub copied in they
# never touch anything else. Install with:
#   pre-commit install --config .github/agent-hub/.pre-commit-config.yaml
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

files: ^\.github/(agent-hub/|workflows/agent-hub-|ISSUE_TEMPLATE/agent-hub-)
# Snapshots and vendored files must stay byte-for-byte as generated.
exclude: ^\.github/agent-hub/tests/(vendor/|.*/expected/)

repos:
  # Several of these declare pre-push as well, which would override
  # default_stages; pin them to commit so push only runs the tests.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  # Workflows, including the shell scripts inside their `run:` steps.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        args: [-config-file, .github/agent-hub/actionlint.yaml]
        additional_dependencies: [shellcheck-py==0.11.0.1]

  # The hub's scripts, test helpers and bats suites.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]
        files: ^\.github/agent-hub/(.*\.sh|tests/.*\.(bash|bats)|tests/lib/bin/claude)$

  - repo: local
    hooks:
      - id: tests
        name: agent hub tests
        entry: npm test --prefix .github/agent-hub/tests
        language: system
        pass_filenames: false
        stages: [pre-push]
