# The agent hub's lint, defined once: run on every commit (fast) and by CI's
# Lint job (agent-hub-tests.yml; see CONTRIBUTING.md). The test suite runs in
# CI's Test job, and locally with `npm test --prefix .github/agent-hub/tests`.
# Local hooks give early feedback but can be skipped; CI is the gate.
#
# Scoped to the hub's files, so in a repository with the hub copied in they
# never touch anything else. Install with:
#   pre-commit install --config .github/agent-hub/.pre-commit-config.yaml
default_install_hook_types: [pre-commit]

files: ^\.github/(agent-hub/|agent-hub-extensions/|workflows/agent-hub-|ISSUE_TEMPLATE/agent-hub-)
# Snapshots and vendored files must stay byte-for-byte as generated.
exclude: ^\.github/agent-hub/tests/(vendor/|.*/expected/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Workflows, including the shell scripts inside their `run:` steps.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        args: [-config-file, .github/agent-hub/actionlint.yaml]
        additional_dependencies: [shellcheck-py==0.11.0.1]

  # The hub's scripts, test helpers and bats suites.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]
        files: ^\.github/agent-hub/(.*\.sh|tests/.*\.(bash|bats)|tests/lib/bin/(claude|gitleaks))$
