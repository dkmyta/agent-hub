name: Agent Build (Jira-triggered, self-hosted)
on:
  repository_dispatch:
    types: [jira-plan-approved]

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Confirm which identity is active (remove once verified)
        run: gh auth status
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Implement change and open draft PR (Claude Code)
        run: |
          echo "=== Claude summary ==="
          claude -p "Jira ticket $TICKET_KEY is approved for implementation.
          Summary: $SUMMARY
          Current content: $DESCRIPTION

          1. Create a new branch named agent/$TICKET_KEY.
          2. Make the smallest reasonable change to satisfy the task.
          3. Commit the change with a clear message.
          4. Push the branch, then open a DRAFT pull request against main. This
             runs non-interactively, so you must pass --title and --body
             explicitly to gh pr create — do not rely on interactive prompts,
             since none are available. Example:
             gh pr create --draft --base main --title '[$TICKET_KEY] <short summary>' --body 'Automated change for $TICKET_KEY.'" \
            --permission-mode dontAsk \
            --allowedTools "Read,Edit,Bash(git *),Bash(gh *)" < /dev/null
          echo "======================="
        env:
          TICKET_KEY: ${{ github.event.client_payload.ticket_key }}
          SUMMARY: ${{ github.event.client_payload.summary }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          GH_TOKEN: ${{ github.token }}

      - name: Report PR back to Jira ticket
        run: |
          ISSUE_URL="https://$JIRA_DOMAIN/rest/api/3/issue/$TICKET_KEY"
          jira() {
            curl -sS --fail-with-body -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }

          PR_URL=$(gh pr list --head "agent/$TICKET_KEY" --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            echo "No PR found for branch agent/$TICKET_KEY — failing instead of silently reporting success."
            exit 1
          fi
          jq -n --arg url "$PR_URL" '{body: {type: "doc", version: 1, content: [
                {type: "paragraph", content: [{type: "text", text: "PR opened: "},
                  {type: "text", text: $url, marks: [{type: "link", attrs: {href: $url}}]}]}]}}' \
            | jira -X POST "$ISSUE_URL/comment" -d @- > /dev/null
        env:
          TICKET_KEY: ${{ github.event.client_payload.ticket_key }}
          GH_TOKEN: ${{ github.token }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
