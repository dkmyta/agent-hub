name: "Agent hub: Build"
run-name: "Build: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}"

# Stage 3 of the agent-hub pipeline. The tracker (the Jira "Build Requested"
# rule, on the move to Implementation Plan Approved) dispatches
# `agent-hub-build-requested` with only the ticket key; the shared stage
# workflow does the rest with this stage's files in
# .github/agent-hub/stages/build, as a code stage: the steps without an agent
# get the machine user's token to push the branch and open a draft pull
# request. See .github/agent-hub/docs/workflows/build.md.

on:
  repository_dispatch:
    types: [agent-hub-build-requested]
  workflow_dispatch:
    inputs:
      ticket_key:
        description: Ticket key (in Implementation Plan Approved)
        required: true
        type: string
      wake:
        description: Set by the CI sweep (ci) — leave empty
        required: false
        type: string
        default: ""

# One group per ticket, shared by every stage (the work order, the plan and
# the build), so nothing for a ticket runs in parallel: a run is never
# cancelled, every request waits its turn (up to 100 pending), and each run
# acts on the ticket as it finds it then.
concurrency:
  group: agent-hub-${{ github.repository }}-${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/agent-hub-stage.yml
    with:
      stage: build
      ticket-key: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
      code-stage: true
      # What woke the run when it isn't a person's approval: the CI sweep
      # (ci), a closed pull request (closed), or a command on the ticket
      # (command, from the tracker's Build Command rule).
      wake: ${{ inputs.wake || github.event.client_payload.wake || '' }}
      agent-minutes: 60
      review-minutes: 30
      fix-minutes: 40
      job-minutes: 240
    secrets: inherit
