name: "Agent hub: Build"
# Runs the hub starts to follow a pull request say what woke them, so they
# don't read as new builds.
run-name: "Build: ${{ inputs.ticket_key }}${{ inputs.wake == 'ci' && ' (CI gate)' || inputs.wake == 'closed' && ' (pull request closed)' || inputs.wake == 'command' && ' (ticket command)' || '' }}"

# Stage 3 of the agent-hub pipeline. The tracker (the Jira "Build Requested"
# rule, on the move to Implementation Plan Approved) starts it with
# workflow_dispatch and only the ticket key; the shared stage
# workflow does the rest with this stage's files in
# .github/agent-hub/stages/build, as a code stage: the steps without an agent
# get the build token to push the branch and open a draft pull
# request. See .github/agent-hub/docs/workflows/build.md.

on:
  workflow_dispatch:
    inputs:
      ticket_key:
        description: Ticket key (in Implementation Plan Approved)
        required: true
        type: string
      wake:
        description: Set by the hub (ci, closed) or the Build Command rule (command) — leave empty, or command to act on /skip and /apply comments by hand
        required: false
        type: string
        default: ""

# One group per ticket, shared by every stage (the work order, the plan and
# the build), so nothing for a ticket runs in parallel: a run is never
# cancelled, every request waits its turn (up to 100 pending), and each run
# acts on the ticket as it finds it then.
concurrency:
  group: agent-hub-${{ github.repository }}-${{ inputs.ticket_key }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/agent-hub-stage.yml
    with:
      stage: build
      ticket-key: ${{ inputs.ticket_key }}
      code-stage: true
      # What woke the run when it isn't a person's approval: the CI sweep
      # (ci), a closed pull request (closed), or a command on the ticket
      # (command, from the tracker's Build Command rule).
      wake: ${{ inputs.wake || '' }}
      agent-minutes: 60
      review-minutes: 30
      fix-minutes: 40
      job-minutes: 270
    secrets: inherit

  # After a /skip changed the items (the stage's request-ci output), the CI
  # sweep is asked to run — the same reconciliation every CI completion
  # starts. It wakes the CI gate for the pull request's head with all its
  # usual checks, so a hand-off the items were holding back doesn't wait
  # for the next scheduled sweep. Its own job: the only one here that can
  # start a workflow (actions: write); it runs nothing from the repository.
  request-ci:
    needs: build
    if: needs.build.outputs.request-ci == 'true'
    permissions:
      actions: write
    runs-on: ${{ fromJSON(vars.AGENT_HUB_RUNS_ON || '["self-hosted", "claude"]') }}
    timeout-minutes: 2
    steps:
      - name: Ask for the CI sweep
        timeout-minutes: 1
        env:
          TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          # The token goes to curl in a file only this user can read, never
          # on a command line (agent-hub-pr-closed.yml does the same).
          config=$(umask 077 && mktemp "$RUNNER_TEMP/github-curl.XXXXXX")
          trap 'rm -f "$config"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" > "$config"
          jq -nc --arg ref "$REF" '{ref: $ref}' \
            | curl -sS --fail-with-body --max-time 30 --config "$config" -X POST \
                -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/agent-hub-ci-sweep.yml/dispatches" -d @-
          echo "CI sweep requested." >> "$GITHUB_STEP_SUMMARY"
