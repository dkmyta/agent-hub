name: "Agent hub: CI sweep"

# The build's CI gate, woken on a schedule (4d-1): every 10 minutes, for each
# of the hub's draft pull requests whose required checks have finished on the
# head the hub last recorded (or waited longer than
# AGENT_HUB_BUILD_CI_WAIT_MINUTES), and whose result the build hasn't handled
# yet, request the build for its ticket — which reads the checks again for
# exactly that head and hands the pull request off, or tells a person why
# not. No agent, no tracker, nothing from a pull request run or trusted; the
# hub's scripts come from the default branch. See
# .github/agent-hub/docs/workflows/build.md ("CI gate").
#
# Woken as soon as CI finishes (since 2.28.0): any workflow run of a pull
# request from one of the hub's branches (agent-hub/*) in this repository
# completing — the repository's CI — starts a sweep; every other completion
# skips the job (no runner). The schedule stays as the backstop, for CI
# outside GitHub Actions and anything missed: GitHub runs schedules on the
# default branch only, can start them hours late, and turns them off in a
# repository with no activity for 60 days (re-enable it under Actions). It
# can also be run by hand.

on:
  workflow_run:
    # Every workflow, by name ("*" matches any name) — except this one: its
    # own completions would start runs of it, up to GitHub's three levels.
    workflows: ["*", "!Agent hub: CI sweep"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# (No workflow-level concurrency: every completed workflow starts a run of
# this one, most of them skipped, and a run joining the group would cancel
# the real wake waiting in it. The job's own, below, holds only runs that do
# a sweep.)

# Reads the pull requests and their checks; `actions: write` only to request
# the build (a workflow_dispatch).
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: write

jobs:
  sweep:
    # The kill switch, and only where the build is turned on
    # (AGENT_HUB_BUILD_ENABLED, or its earlier name AGENT_HUB_BUILD_PREVIEW).
    # A completed workflow wakes it only for a pull request from one of the
    # hub's branches in this repository — never the sweep's own runs, or
    # anything else, so it can't wake itself.
    if: >-
      vars.AGENT_HUB_ENABLED != 'false' && (vars.AGENT_HUB_BUILD_ENABLED == 'true' || vars.AGENT_HUB_BUILD_PREVIEW == 'true')
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'agent-hub/')
      && github.event.workflow_run.head_repository.full_name == github.repository))
    # One sweep at a time, and one waiting: a newer wake replaces a waiting
    # one, which does the same pass. Only a job that runs joins the group —
    # a skipped one never does, so it can't cancel a wake.
    concurrency:
      group: agent-hub-ci-sweep
      cancel-in-progress: false
    runs-on: ${{ fromJSON(vars.AGENT_HUB_RUNS_ON || '["self-hosted", "claude"]') }}
    timeout-minutes: 5
    steps:
      # A self-hosted runner keeps its work folder between jobs: what an
      # earlier job left there — a sparse checkout's settings, an agent's
      # files — mustn't reach this one, so it's emptied first, before the
      # checkout (the same step as agent-hub-stage.yml's).
      - name: Clear the work folder
        if: runner.environment == 'self-hosted'
        timeout-minutes: 2
        run: |
          [ -n "$GITHUB_WORKSPACE" ] && [ -d "$GITHUB_WORKSPACE" ] || exit 0
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/agent-hub

      - name: Wake builds whose CI has finished
        timeout-minutes: 3
        env:
          VARS: ${{ toJSON(vars) }}
          AGENT_HUB_GITHUB_TOKEN: ${{ github.token }}
          AGENT_HUB_CI_TOKEN: ${{ github.token }}
        run: |
          source .github/agent-hub/stages/build/sweep.sh
          build_ci_sweep
