name: "Agent hub: Implementation plan"
run-name: "Implementation plan: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}"

# Stage 2 of the agent-hub pipeline. The tracker (the Jira "Implementation
# Plan Requested" or "Revision Requested" rule) dispatches `agent-hub-implementation-plan-requested`
# with only the ticket key; the shared stage workflow does the rest with this
# stage's files in .github/agent-hub/stages/implementation-plan. See
# .github/agent-hub/docs/workflows/implementation-plan.md.

on:
  repository_dispatch:
    types: [agent-hub-implementation-plan-requested]
  workflow_dispatch:
    inputs:
      ticket_key:
        description: Ticket key (in Work Order Approved for a new plan, or Implementation Plan to revise it)
        required: true
        type: string

# One group per ticket, shared by every stage (the work order, the plan and
# the build), so nothing for a ticket runs in parallel: a run is never
# cancelled, every request waits its turn (up to 100 pending), and each run
# acts on the ticket as it finds it then.
concurrency:
  group: agent-hub-${{ github.repository }}-${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read

jobs:
  implementation-plan:
    uses: ./.github/workflows/agent-hub-stage.yml
    with:
      stage: implementation-plan
      ticket-key: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
      agent-minutes: 50
      job-minutes: 75
    secrets: inherit
