name: "Agent hub: Pull request closed"

# When one of the hub's pull requests is closed — merged or not — request the
# build for its ticket (wake: closed), which moves the ticket to Done only if
# the hub handed the pull request off and GitHub reports it merged, and
# otherwise tells a person (.github/agent-hub/stages/build/closed.sh; step 5a).
#
# An event handler only: no checkout, no repository scripts, no agent, no
# tracker. `pull_request_target` runs this file as it is on the default
# branch, never a pull request's version; nothing from the pull request is
# run — its branch name is only matched against a fixed pattern, from the
# environment. The build re-reads everything from GitHub and the ticket.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  wake:
    # The kill switch; only while the build preview is on; only the hub's own
    # pull requests (its label, its branch prefix, this repository).
    if: >-
      vars.AGENT_HUB_ENABLED != 'false' && vars.AGENT_HUB_BUILD_PREVIEW == 'true'
      && contains(github.event.pull_request.labels.*.name, vars.AGENT_HUB_BUILD_LABEL || 'agent-hub')
      && startsWith(github.event.pull_request.head.ref, 'agent-hub/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.AGENT_HUB_RUNS_ON || '["self-hosted", "claude"]') }}
    timeout-minutes: 3
    steps:
      - name: Request the build for the ticket
        timeout-minutes: 2
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          key=${HEAD_REF#agent-hub/}
          if ! [[ "$key" =~ ^[A-Z][A-Z0-9_]*-[0-9]+$ ]]; then
            echo "Not a ticket branch; nothing to do."
            exit 0
          fi
          # The token goes to curl in a file only this user can read, never
          # on a command line.
          config=$(umask 077 && mktemp "$RUNNER_TEMP/github-curl.XXXXXX")
          trap 'rm -f "$config"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" > "$config"
          jq -nc --arg ref "$DEFAULT_BRANCH" --arg key "$key" '{ref: $ref, inputs: {ticket_key: $key, wake: "closed"}}' \
            | curl -sS --fail-with-body --max-time 30 --config "$config" -X POST \
                -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/repos/$REPO/actions/workflows/agent-hub-build.yml/dispatches" -d @-
          echo "Requested the build for $key."
