name: "Agent hub: stage"

# The one workflow every agent-hub stage runs through, called by the stage
# workflows (agent-hub-work-order.yml, agent-hub-implementation-plan.yml) with
# the stage's name and the ticket key. Each step loads what it needs
# (lib/load.sh: the settings, the tracker or the agent runner, the shared
# library and the stage), then calls the stage's own function for that step
# (stages/<stage>/stage.sh): step_fetch, step_agent, step_apply, step_return.
#
# Each step loads the hub from a copy made right after the checkout (Copy the
# hub), never from the checkout itself, which a build agent can change.
#
# Per-repository settings come from repository variables, passed to the steps
# as JSON (see .github/agent-hub/docs/setup.md); nothing here needs editing per repository.

on:
  workflow_call:
    inputs:
      stage:
        description: The stage's folder name under .github/agent-hub/stages
        required: true
        type: string
      ticket-key:
        description: The ticket to work on
        required: true
        type: string
      agent-minutes:
        description: Time limit for the agent step (draft and review)
        required: true
        type: number
      review-minutes:
        description: Time limit for a code stage's review step (unused by the document stages)
        required: false
        type: number
        default: 30
      fix-minutes:
        description: Time limit for a code stage's fix step — the fix pass and its fix check (unused by the document stages)
        required: false
        type: number
        default: 40
      job-minutes:
        description: Time limit for the whole job; the steps' limits together fit within it
        required: true
        type: number
      # For stages that change code (the build). Off for the document stages.
      code-stage:
        description: >-
          Check out the full history and give the steps that don't run an agent
          the machine user's GitHub token (AGENT_HUB_GITHUB_TOKEN) to the fetch
          and apply steps only, to check and push the stage's branch and open
          its pull request. No other step gets it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stage:
    # The kill switch: the repository variable AGENT_HUB_ENABLED set to false
    # skips every stage (the run shows the job as skipped). Only admins can
    # change repository variables.
    if: vars.AGENT_HUB_ENABLED != 'false'
    # Default: a self-hosted runner labelled `claude`, where Claude Code is
    # logged in with a Claude subscription. Set AGENT_HUB_RUNS_ON (a JSON
    # label list, e.g. ["ubuntu-latest"]) plus the AGENT_HUB_ANTHROPIC_API_KEY
    # secret to use the Claude API instead. See .github/agent-hub/docs/runners.md.
    runs-on: ${{ fromJSON(vars.AGENT_HUB_RUNS_ON || '["self-hosted", "claude"]') }}
    # Every step has its own limit and together they fit within this one, so a
    # slow step fails (and is reported on the ticket) instead of the whole job
    # being cancelled.
    timeout-minutes: ${{ inputs.job-minutes }}
    env:
      # Claude Code doesn't update itself during a run: the version is the
      # runner's (and, for the build, the pinned one; docs/runners.md).
      DISABLE_AUTOUPDATER: "1"
      STAGE: ${{ inputs.stage }}
      TICKET_KEY: ${{ inputs.ticket-key }}
      VARS: ${{ toJSON(vars) }}
    steps:
      # Leaves out recorded test data (past Claude outputs, snapshots, eval
      # tickets) so Claude works from the ticket and the code, not from a
      # recorded answer. The evals mirror these patterns.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build reads the history since the plan's base commit.
          fetch-depth: ${{ inputs.code-stage && '0' || '1' }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.github/agent-hub/tests/*/fixtures/
            !/.github/agent-hub/tests/*/scenarios/
            !/.github/agent-hub/tests/*/evals/
            !/.github/agent-hub/tests/*/expected/

      # The hub's scripts, copied out of the checkout before any agent runs.
      # Every step loads them from this copy, so nothing an agent changes in
      # the checkout (a build agent can edit it) runs in a later step, where
      # the credentials are.
      - name: Copy the hub
        timeout-minutes: 1
        run: |
          mkdir "$RUNNER_TEMP/agent-hub"
          cp -R .github/agent-hub/lib .github/agent-hub/stages .github/agent-hub/trackers \
            .github/agent-hub/VERSION "$RUNNER_TEMP/agent-hub/"

      # Code stages run the repository's code (installs, checks, the agent's
      # commands): with the Node version it declares, set up before anything
      # runs (lib/toolchain.sh) — or, for a repository that isn't a Node
      # project, the version the hub's sandbox runtime runs on.
      - name: Find the toolchain
        id: toolchain
        if: inputs.code-stage
        timeout-minutes: 1
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/toolchain.sh"
          toolchain_outputs >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: inputs.code-stage
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ steps.toolchain.outputs.node-version-file }}
          node-version: ${{ steps.toolchain.outputs.node-version }}
          # No cache shared between runs: every build installs from the lockfile.
          package-manager-cache: false

      # What the sandboxes need on Linux (macOS has it built in); self-hosted
      # Linux runners have them installed (.github/agent-hub/docs/runners.md).
      - name: Install sandbox tools
        if: inputs.code-stage && runner.environment == 'github-hosted' && runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap socat ripgrep
          # Ubuntu 24.04 restricts the user namespaces both sandboxes use.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2> /dev/null || true

      # GitHub-hosted runners don't have Claude Code; self-hosted runners have
      # it installed (see .github/agent-hub/docs/runners.md).
      - name: Install Claude Code
        if: runner.environment == 'github-hosted'
        timeout-minutes: 3
        env:
          CLAUDE_CODE_VERSION: ${{ vars.AGENT_HUB_CLAUDE_CODE_VERSION || 'latest' }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Fetch ticket
        id: start
        timeout-minutes: 3
        # The machine user's GitHub token reaches only this step and Apply —
        # the two that call GitHub, and run no repository code — and only
        # for a code stage. Never an agent step, nor (later) install or
        # verify steps, which run the repository's own code.
        env: &github-env
          JIRA_DOMAIN: ${{ secrets.AGENT_HUB_JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.AGENT_HUB_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.AGENT_HUB_JIRA_API_TOKEN }}
          AGENT_HUB_GITHUB_TOKEN: ${{ inputs.code-stage && secrets.AGENT_HUB_GITHUB_TOKEN || '' }}
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" tracker
          step_fetch

      # Code stages: the repository's dependencies, from its lockfile, in the
      # sandbox (registries only) — no agent, no secrets.
      - name: Install dependencies
        id: install
        if: inputs.code-stage && steps.start.outputs.proceed == 'true'
        timeout-minutes: 15
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" sandbox
          step_install

      # The only step that uses Claude, and it never gets the tracker's
      # credentials: it can't change the ticket, only return a result.
      - name: Agent (draft and review)
        id: agent
        if: steps.start.outputs.proceed == 'true'
        timeout-minutes: ${{ inputs.agent-minutes }}
        env:
          # Only used when set, and only where Claude Code has no login (a
          # subscription login on the runner takes precedence). Empty is fine.
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_HUB_ANTHROPIC_API_KEY }}
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" agent
          step_agent

      # Code stages: the agent's changes committed (with the metadata copied
      # before it ran) and the repository's checks run on exactly that commit,
      # in the sandbox (no network) — no agent, no secrets. Apply pushes only
      # a commit that passed.
      - name: Verify
        id: verify
        if: inputs.code-stage && steps.agent.outputs.status == 'ready'
        timeout-minutes: 30
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" sandbox
          step_verify

      # Code stages: an independent review of the build's commit — a fresh
      # session with the review profile (commands, no edits, no web), and
      # the API key but no other secret. It changes nothing; its findings
      # become items on the pull request. A review that fails or times out
      # mustn't cost the build already made: the job goes on, and Apply
      # pushes the draft with the review as a decision item.
      - name: Review
        id: review
        if: inputs.code-stage && steps.verify.outcome == 'success'
        continue-on-error: true
        timeout-minutes: ${{ inputs.review-minutes }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_HUB_ANTHROPIC_API_KEY }}
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" agent
          step_review

      # Code stages: the review's fix-eligible findings fixed once (the build
      # profile), then a fresh read-only fix check of each fix. Like the
      # review, it never costs the build: on any failure the job goes on.
      - name: Fix
        id: fix
        if: inputs.code-stage && steps.review.outcome == 'success'
        continue-on-error: true
        timeout-minutes: ${{ inputs.fix-minutes }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_HUB_ANTHROPIC_API_KEY }}
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" agent
          step_fix

      # Code stages: the fix committed on top of the reviewed commit and kept
      # only if the gates and the repository's checks pass on it (in the
      # sandbox, no network) — no agent, no secrets. Otherwise the reviewed
      # commit is pushed as it was; Apply drops a fix this didn't finish.
      - name: Verify fix
        id: verify-fix
        if: inputs.code-stage && steps.fix.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" sandbox
          step_verify_fix

      - name: Apply to ticket
        id: apply
        if: steps.agent.outputs.status == 'ready'
        timeout-minutes: 3
        env: *github-env
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" tracker
          step_apply

      # Any other result sends the ticket back (needs details, needs
      # clarification, …), as the stage defines.
      - name: Send back
        id: return
        if: steps.agent.outputs.status != '' && steps.agent.outputs.status != 'ready'
        timeout-minutes: 3
        env: &tracker-env
          JIRA_DOMAIN: ${{ secrets.AGENT_HUB_JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.AGENT_HUB_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.AGENT_HUB_JIRA_API_TOKEN }}
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" tracker
          step_return

      # Every run that used Claude is added to the ticket's usage, whatever
      # happened after, for its caps (docs/claude-usage.md, "Per-ticket
      # caps"). Nothing to do if Claude wasn't used, or the hub never loaded.
      - name: Record Claude usage
        if: always()
        timeout-minutes: 2
        env: *tracker-env
        run: |
          [ -f "$RUNNER_TEMP/agent-hub/lib/load.sh" ] || exit 0
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" tracker
          stage_record_usage

      # Runs on success and on cancellation (a person cancelled the run), so
      # no "⏳" progress comment is left behind.
      - name: Clear progress comment
        if: success() || cancelled()
        timeout-minutes: 2
        env: *tracker-env
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" tracker
          stage_clear_progress

      - name: Report failure on ticket
        if: failure()
        timeout-minutes: 2
        env: *tracker-env
        run: |
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" tracker
          stage_report_failure "$FAILURE_TITLE" "$(stage_start_status "$HOME_STATUS")"

      # Claude Code's files for this job's sessions (its temp folder can be
      # read by later runs on the same runner) are deleted whatever happened:
      # success, failure, timeout or cancellation. See docs/architecture.md.
      # So are credential files a step couldn't remove itself (one killed by
      # its time limit). Without the hub's copy nothing ran, so there's
      # nothing more to remove.
      - name: Remove session and credential files
        if: always()
        timeout-minutes: 1
        run: |
          rm -f "$RUNNER_TEMP"/jira-curl.* "$RUNNER_TEMP"/github-curl.* "$RUNNER_TEMP"/github-token.* "$RUNNER_TEMP"/github-askpass.*
          [ -f "$RUNNER_TEMP/agent-hub/lib/load.sh" ] || exit 0
          source "$RUNNER_TEMP/agent-hub/lib/load.sh" agent
          agent_cleanup
