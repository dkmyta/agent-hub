name: "Agent hub: Work order"
run-name: "Work order: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}"

# Stage 1 of the agent-hub pipeline. The tracker (the Jira "Work Order
# Requested" or "Revision Requested" rule) dispatches `agent-hub-work-order-requested`
# with only the ticket key; the shared stage workflow does the rest with this
# stage's files in .github/agent-hub/stages/work-order. See
# .github/agent-hub/docs/workflows/work-order.md.

on:
  repository_dispatch:
    types: [agent-hub-work-order-requested]
  workflow_dispatch:
    inputs:
      ticket_key:
        description: Ticket key (the ticket must be in the Work Order status)
        required: true
        type: string

# One run per ticket: a newer request cancels one still in progress, so the
# latest version of the ticket wins.
concurrency:
  group: agent-hub-work-order-${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  work-order:
    uses: ./.github/workflows/agent-hub-stage.yml
    with:
      stage: work-order
      ticket-key: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
      agent-minutes: 35
      job-minutes: 55
    secrets: inherit
