name: Agent — Work Order
run-name: "Work order: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}"

# Stage 1 of the Jira → GitHub agent pipeline. The Jira "Work Order Requested"
# rule moves a ticket to Work Order and dispatches `work-order-requested` with
# only the ticket key; everything else is read from Jira. Claude reviews the
# ticket read-only and returns structured output; the Jira steps apply it.
#
# The same run revises: when the ticket already has a work order (a "/revise"
# comment, or a work order edited and resubmitted from Intake), Claude revises
# it with the change requests instead of starting over (docs/workflows/work-order.md).
#
# Agent files live in .github/agents: lib/ is shared by every stage,
# work-order/ holds this stage's prompt, output schema and ticket layout.
#
# Per-repository settings come from repository variables (Settings → Secrets
# and variables → Actions → Variables); each has a default below, so a repo
# only sets what differs. See docs/setup.md.

on:
  repository_dispatch:
    types: [work-order-requested]
  workflow_dispatch:
    inputs:
      ticket_key:
        description: Jira ticket key (the ticket must be in the Work Order status)
        required: true
        type: string

# One run per ticket: a newer request cancels one still in progress, so the
# latest version of the ticket wins.
concurrency:
  group: work-order-${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TICKET_KEY: ${{ github.event.client_payload.ticket_key || inputs.ticket_key }}
  AGENTS_DIR: .github/agents
  AGENT_DIR: .github/agents/work-order
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
  # Used automatically when CLAUDE_MODEL is overloaded.
  CLAUDE_FALLBACK_MODEL: ${{ vars.CLAUDE_FALLBACK_MODEL || 'claude-opus-5-5' }}
  # Stops a runaway run; exceeding it fails the run with the failure comment.
  # API-equivalent dollars (typical costs: docs/claude-usage.md). With a Claude
  # subscription nothing is billed but runs use the plan's limits, so this
  # protects those; with an API key it caps spend.
  CLAUDE_MAX_BUDGET_USD: ${{ vars.CLAUDE_MAX_BUDGET_USD || '2.00' }}
  # Expert review of every draft before it reaches the ticket (docs/architecture.md):
  # a strong model reviewing a draft catches what the drafter missed.
  REVIEW_CLAUDE_MODEL: ${{ vars.REVIEW_CLAUDE_MODEL || 'claude-opus-5-5' }}
  REVIEW_CLAUDE_FALLBACK_MODEL: ${{ vars.REVIEW_CLAUDE_FALLBACK_MODEL || 'claude-sonnet-5' }}
  REVIEW_CLAUDE_MAX_BUDGET_USD: ${{ vars.REVIEW_CLAUDE_MAX_BUDGET_USD || '2.00' }}
  # A revision is scoped to the requested changes, so each of its passes has
  # this lower cap instead.
  REVISION_MAX_BUDGET_USD: ${{ vars.REVISION_MAX_BUDGET_USD || '1.00' }}
  # The only sites Claude may fetch pages from (web search is unrestricted), so
  # a malicious ticket can't get repository content sent to an arbitrary URL.
  # Space-separated.
  CLAUDE_FETCH_DOMAINS: >-
    ${{ vars.CLAUDE_FETCH_DOMAINS || 'docs.github.com developer.atlassian.com support.atlassian.com docs.anthropic.com docs.claude.com developer.mozilla.org nodejs.org docs.npmjs.com' }}
  # Jira names this workflow depends on; must match the Jira project's workflow
  # and the "Work Order Requested" automation rule.
  WORK_ORDER_STATUS: ${{ vars.JIRA_WORK_ORDER_STATUS || 'Work Order' }}
  INTAKE_STATUS: ${{ vars.JIRA_INTAKE_STATUS || 'Intake' }}
  NEEDS_DETAILS_LABEL: ${{ vars.JIRA_NEEDS_DETAILS_LABEL || 'needs-details' }}
  # Marks tickets waiting for a person (e.g. to approve the work order); the
  # Jira rules for the "…Approved" transitions remove it.
  NEEDS_HUMAN_LABEL: ${{ vars.JIRA_NEEDS_HUMAN_LABEL || 'needs-human' }}
  # Comment text: the rule's Needs details comment must use the same title and
  # message, so both are recognised when resolving them.
  NEEDS_DETAILS_TITLE: Needs details
  NEEDS_DETAILS_MESSAGE: "This ticket doesn’t have enough detail to generate a work order, so it’s in Intake until more is added. Update the description, or add the details in a comment starting with /revise, to resubmit it automatically."
  # Comments starting with this are change requests (or retries); the Jira
  # "Revision Requested" rule dispatches a run for them, and the run marks
  # them resolved once handled.
  REVISE_COMMAND: ${{ vars.JIRA_REVISE_COMMAND || '/revise' }}
  # The plan stage's questions: when a revision here settles them, the label
  # and comment are cleared (the names must match the plan stage's).
  NEEDS_CLARIFICATION_LABEL: ${{ vars.JIRA_NEEDS_CLARIFICATION_LABEL || 'needs-clarification' }}
  NEEDS_CLARIFICATION_TITLE: Needs clarification
  # The work order section the plan stage fills in, and its attachment's name:
  # a revised work order marks an earlier plan as out of date.
  PLAN_SECTION: Implementation Plan
  PLAN_FILE_SUFFIX: implementation-plan.md
  # Closes the Original Request comment; also how a re-run recognises it.
  ORIGINAL_REQUEST_NOTE: Captured from the original intake form before the work order replaced the description.
  # "false" suppresses watcher notifications for the description update
  # (requires Jira admin permission for the API user).
  JIRA_NOTIFY_USERS: ${{ vars.JIRA_NOTIFY_USERS || 'true' }}

jobs:
  work-order:
    # Default: a self-hosted runner labelled `claude`, where Claude Code is
    # logged in with a Claude subscription. Set AGENT_RUNS_ON (a JSON label
    # list, e.g. ["ubuntu-latest"]) plus the ANTHROPIC_API_KEY secret to use
    # the Claude API instead. See docs/runners.md.
    runs-on: ${{ fromJSON(vars.AGENT_RUNS_ON || '["self-hosted", "claude"]') }}
    # Every step has its own limit and together they fit within this one, so a
    # slow step fails (and is reported on the ticket) instead of the whole job
    # being cancelled.
    timeout-minutes: 55
    steps:
      # Leaves out recorded test data (past Claude outputs, snapshots, eval
      # tickets) so Claude works from the ticket and the code, not from a
      # recorded answer. The evals mirror these patterns.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/*/fixtures/
            !/tests/*/scenarios/
            !/tests/*/evals/
            !/tests/*/expected/

      # GitHub-hosted runners don't have Claude Code; self-hosted runners have
      # it installed (see docs/runners.md).
      - name: Install Claude Code
        if: runner.environment == 'github-hosted'
        timeout-minutes: 3
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Fetch ticket
        id: start
        timeout-minutes: 3
        env: &jira-env
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          source "$AGENTS_DIR/lib/jira.sh"
          source "$AGENTS_DIR/lib/stage.sh"
          stage_fetch "$WORK_ORDER_STATUS" || exit 0
          # A description that's already a work order (it has any of the work
          # order's group headings — one removed by hand doesn't change that)
          # is revised rather than replaced.
          if jq -e -L "$AGENTS_DIR/lib" 'include "adf";
               .fields.description // {content: []} | . as $d
               | any("Overview", "Scope", "Developer Notes", "Risk & Open Questions", "Delivery"; . as $title | $d | section_index($title) != null)' \
               "$RUNNER_TEMP/ticket.json" > /dev/null; then
            echo revision > "$RUNNER_TEMP/mode"
          else
            echo new > "$RUNNER_TEMP/mode"
          fi
          MODE=$(cat "$RUNNER_TEMP/mode" 2>/dev/null || echo new)
          echo "Mode: $MODE."
          # Comments hold extra details and change requests.
          stage_ticket_markdown --with-comments
          # Shows people on the ticket that a run is going; cleared when it
          # ends, or turned into the failure notice.
          if [ "$MODE" = revision ]; then
            stage_progress_comment "⏳ Revising work order" \
              " — usually takes 1–3 minutes. Refresh the page to see the result. "
          else
            stage_progress_comment "⏳ Generating work order" \
              " — usually takes 1–2 minutes. Refresh the page to see the result. "
          fi

      - name: Generate work order (Claude Code)
        id: claude
        if: steps.start.outputs.proceed == 'true'
        timeout-minutes: 35
        env:
          # Only used when set, and only where Claude Code has no login (a
          # subscription login on the runner takes precedence). Empty is fine.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          source "$AGENTS_DIR/lib/claude.sh"
          MODE=$(cat "$RUNNER_TEMP/mode" 2>/dev/null || echo new)
          if [ "$MODE" = revision ]; then
            claude_run "Revise the work order in this Jira ticket's description, addressing the change requests in its comments." work_order
          else
            claude_run "Prepare the work order for this Jira ticket." work_order
          fi
          claude_check work_order needs-details missing
          claude_review "Review this work order draft and return the final version."
          claude_check work_order needs-details missing
          claude_summary "Work order"

      - name: Apply work order to ticket
        id: apply
        if: steps.claude.outputs.status == 'ready'
        timeout-minutes: 3
        env: *jira-env
        run: |
          source "$AGENTS_DIR/lib/jira.sh"
          source "$AGENTS_DIR/lib/stage.sh"
          jira_require_status "$WORK_ORDER_STATUS" || exit 0
          MODE=$(cat "$RUNNER_TEMP/mode" 2>/dev/null || echo new)

          # The reviewed work order, with the review's note at the top. A
          # revision changes only its updated sections of the current
          # description (read fresh, so people's edits — even during the run —
          # are kept), and replaces the previous review note.
          if [ "$MODE" = revision ]; then
            source "$AGENT_DIR/revise.sh"
            jq '.structured_output.updates' "$RUNNER_TEMP/claude-output.json" > "$RUNNER_TEMP/updates.json"
            jira_issue description | jq '.fields.description' > "$RUNNER_TEMP/current-description.json"
            # A section the revision changes may have been removed by hand: say
            # which, before changing anything, rather than guess where it goes.
            MISSING_SECTIONS=$(revision_missing_sections "$RUNNER_TEMP/updates.json" < "$RUNNER_TEMP/current-description.json")
            if [ -n "$MISSING_SECTIONS" ]; then
              stage_fail "The revision changes sections this work order no longer has: $MISSING_SECTIONS. Nothing was changed. Put the heading(s) back in the description (same name and heading level as the other sections), then comment $REVISE_COMMAND again."
            fi
            revision_description "$RUNNER_TEMP/updates.json" < "$RUNNER_TEMP/current-description.json"
          else
            jq '.structured_output.work_order' "$RUNNER_TEMP/claude-output.json" \
              | jq -L "$AGENTS_DIR/lib" -f "$AGENT_DIR/render.jq"
          fi | jq -L "$AGENTS_DIR/lib" --slurpfile review "$RUNNER_TEMP/review.json" 'include "adf";
                .content = [para([em("Expert review: \($review[0].note)")])]
                  + (.content | if (.[0].type == "paragraph" and (.[0] | plain_text | startswith("Expert review:"))) then .[1:] else . end)' \
            > "$RUNNER_TEMP/description.json"
          jira_comments > "$RUNNER_TEMP/comments.json"

          # A revised work order supersedes any plan written for the previous
          # version: say so where its summary was (the plan stage replaces the
          # attachment when the work order is approved again).
          PLAN_FILE="$TICKET_KEY-$PLAN_FILE_SUFFIX"
          if [ "$MODE" = revision ] \
             && jira_attachments | jq -e --arg name "$PLAN_FILE" 'any(.[]; .filename == $name)' > /dev/null; then
            # shellcheck disable=SC1112 # curly apostrophe intended
            jq -L "$AGENTS_DIR/lib" --arg section "$PLAN_SECTION" --arg file "$PLAN_FILE" 'include "adf";
              if section_index($section) == null then . else
              replace_section($section; [para([text("The attached plan ("), code($file),
                text(") was written for an earlier version of this work order and is out of date. It’s replaced when the work order is approved again, by a new plan written from this work order — changes made to the old plan (by hand or with /revise) don’t carry over.")])]) end' \
              "$RUNNER_TEMP/description.json" > "$RUNNER_TEMP/description.new" && mv "$RUNNER_TEMP/description.new" "$RUNNER_TEMP/description.json"
          fi

          # A new work order keeps the original request as a comment before
          # overwriting it — read fresh so formatting survives and edits made
          # during the run are captured; if the comment fails, nothing is
          # overwritten. Not when revising (the description is a work order,
          # and the request was captured the first time), nor if this exact
          # request was already captured (a retry after a failed update).
          if [ "$MODE" = new ]; then
            jira_issue description > "$RUNNER_TEMP/original-request.json"
            ALREADY_CAPTURED=$(jq -L "$AGENTS_DIR/lib" --arg note "$ORIGINAL_REQUEST_NOTE" \
              --slurpfile issue "$RUNNER_TEMP/original-request.json" 'include "adf";
              ($issue[0].fields.description | to_markdown) as $current
              | [.comments[].body | select([.. | objects | select(.type == "text") | .text] | last == $note)
                 | {content: .content[:-2]} | to_markdown] | any(. == $current)' "$RUNNER_TEMP/comments.json")
            if [ "$ALREADY_CAPTURED" = true ]; then
              echo "::notice::Original request already captured on $TICKET_KEY — not posting it again."
            elif jq -e '.fields.description.content | length > 0' "$RUNNER_TEMP/original-request.json" > /dev/null; then
              jq -L "$AGENTS_DIR/lib" --arg note "$ORIGINAL_REQUEST_NOTE" 'include "adf";
                doc(.fields.description.content + [divider, para([em($note)])])' \
                "$RUNNER_TEMP/original-request.json" | jira_comment > /dev/null
            fi
          fi

          jira_set_description < "$RUNNER_TEMP/description.json"
          # Waiting for a person to review and approve the work order.
          jira_add_label "$NEEDS_HUMAN_LABEL"

          # Say how each change request was handled, then mark them and earlier
          # needs-details comments (from the Jira rule or Claude) as resolved.
          stage_revision_reply "work order"
          RESOLVED=$(stage_resolve_comments "$RUNNER_TEMP/comments.json" \
            "details were added and the work order was generated." "$NEEDS_DETAILS_TITLE")
          REVISIONS=$(stage_resolve_revisions "$RUNNER_TEMP/comments.json")
          # The plan stage's open questions are now answered: no longer waiting
          # on a decision, only on approval.
          if jq -e '.structured_output.clarification_settled == true' "$RUNNER_TEMP/claude-output.json" > /dev/null; then
            jira_remove_label "$NEEDS_CLARIFICATION_LABEL"
            stage_resolve_comments "$RUNNER_TEMP/comments.json" \
              "settled in the work order; approve it to write the plan." "$NEEDS_CLARIFICATION_TITLE" > /dev/null
          fi

          echo "Work order $([ "$MODE" = revision ] && echo revised || echo written) on [$TICKET_KEY]($TICKET_URL); resolved $RESOLVED needs-details comment(s) and $REVISIONS change request(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Return ticket to Intake
        id: return
        if: steps.claude.outputs.status == 'needs-details'
        timeout-minutes: 3
        env: *jira-env
        run: |
          source "$AGENTS_DIR/lib/jira.sh"
          source "$AGENTS_DIR/lib/stage.sh"
          jira_require_status "$WORK_ORDER_STATUS" || exit 0
          # Before changing anything, so a misconfigured Jira workflow can't
          # leave a half-processed ticket.
          TRANSITION_ID=$(stage_transition_id "$INTAKE_STATUS")

          # Same standard message as the Jira rule's no-details comment, plus
          # the source and Claude's specifics. (Curly apostrophes intended.)
          # shellcheck disable=SC1112
          jq -L "$AGENTS_DIR/lib" --arg title "$NEEDS_DETAILS_TITLE" --arg message "$NEEDS_DETAILS_MESSAGE" 'include "adf";
            doc([para([strong($title), text(" — flagged by Claude (work order review).")]),
                 para($message),
                 para([strong("What’s missing: "), text(.structured_output.missing)])])' \
            "$RUNNER_TEMP/claude-output.json" | jira_comment > /dev/null
          jira_add_label "$NEEDS_DETAILS_LABEL"
          # Waiting on the requester now, not a reviewer (set when revising).
          jira_remove_label "$NEEDS_HUMAN_LABEL"
          jira_transition "$TRANSITION_ID"

          echo "[$TICKET_KEY]($TICKET_URL) returned to $INTAKE_STATUS as $NEEDS_DETAILS_LABEL." >> "$GITHUB_STEP_SUMMARY"

      # Runs on success and on cancellation (a newer request for the ticket
      # superseded this run), so no "⏳ Generating" comment is left behind.
      - name: Clear progress comment
        if: success() || cancelled()
        timeout-minutes: 2
        env: *jira-env
        run: |
          source "$AGENTS_DIR/lib/jira.sh"
          source "$AGENTS_DIR/lib/stage.sh"
          stage_clear_progress

      - name: Report failure on ticket
        if: failure()
        timeout-minutes: 2
        env: *jira-env
        run: |
          source "$AGENTS_DIR/lib/jira.sh"
          source "$AGENTS_DIR/lib/stage.sh"
          stage_report_failure "❌ Work order generation failed" "$WORK_ORDER_STATUS"
