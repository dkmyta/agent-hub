name: "Playground: tests"

# The playground's CI (playground/README.md): its tests on pull requests that
# change it — what a repository's own CI does for the build stage's pull
# requests.

on:
  pull_request:
    paths: [playground/**]
  push:
    branches: [main]
    paths: [playground/**]

permissions:
  contents: read

jobs:
  test:
    name: Playground tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node version the playground declares — the one the build stage
      # sets up for it too (agent-hub docs/workflows/build.md, "Toolchain").
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: playground/.nvmrc
          package-manager-cache: false
      - name: Test
        working-directory: playground
        run: npm test
