name: Tests

# The gate for every pull request: the same checks as the local hooks
# (.pre-commit-config.yaml), which contributors can skip, plus the test suite
# on both jq versions. Runs on GitHub-hosted runners with no Jira, Claude or
# self-hosted runner involved, so it's safe for pull requests from forks.
# See CONTRIBUTING.md and tests/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the commit-stage hooks; the tests (a push-stage hook) run below.
      - name: pre-commit (formatting, actionlint, shellcheck)
        run: pipx run --spec pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure

  # Unit tests can't tell whether Claude still decides well, so flag pull
  # requests that change prompts, schemas or Claude settings. A warning, not a
  # required check: running the evals uses Claude and is done by hand.
  eval-reminder:
    name: Eval reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for agent behaviour changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(.github/scripts/agent-behaviour-changes.sh "$BASE_SHA")
          if [ -z "$changes" ]; then
            echo "No prompt, schema or Claude setting changes."
            exit 0
          fi
          echo "::warning title=Run Agent Evals before merging::This PR changes how the agents decide. Run Actions → Agent Evals on this branch."
          {
            echo "### ⚠️ Run Agent Evals before merging"
            echo
            echo "This PR changes prompts, schemas or Claude settings, which unit tests can't evaluate."
            echo "Run **Actions → Agent Evals → Run workflow** on this branch and check it passes (see docs/evals.md)."
            echo
            echo '```'
            echo "$changes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (jq ${{ matrix.jq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.8.2 matches the self-hosted runner; 1.7.1 is what GitHub-hosted
        # runners have (the Claude API setup, docs/runners.md).
        jq: ["1.7.1", "1.8.2"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install jq ${{ matrix.jq }}
        env:
          JQ_VERSION: ${{ matrix.jq }}
        # Checksums pinned from each release's sha256sum.txt.
        run: |
          case "$JQ_VERSION" in
            1.7.1) sha256=5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5 ;;
            1.8.2) sha256=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f ;;
            *) echo "::error::No checksum pinned for jq $JQ_VERSION"; exit 1 ;;
          esac
          url=https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/jq" "$url"
          echo "$sha256  $RUNNER_TEMP/bin/jq" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/jq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # --ignore-scripts: none of the test dependencies need install scripts.
      - run: npm ci --prefix tests --ignore-scripts

      - run: npm test --prefix tests

  # The single check to require on main (with Lint): passes only if every
  # matrix job passed, so changing the jq versions never changes the name of a
  # required check.
  test-result:
    name: Test
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Test matrix result: $RESULT"
          [ "$RESULT" = success ]
